name: Deploy API with Cloudflare Tunnel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install and Run
      run: |
        # Install dependencies
        npm install express axios cheerio node-cache compression xml2js
        
        # Install cloudflared
        curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
        chmod +x cloudflared
        
        # Start all three servers in background with nohup
        nohup node server1.js > server1.log 2>&1 &
        nohup node server2.js > server2.log 2>&1 &
        nohup node server3.js > server3.log 2>&1 &
        
        # Wait for servers to start
        sleep 15
        
        # Show logs to debug
        echo "=== Server1 Log ==="
        cat server1.log
        echo "=== Server2 Log ==="
        cat server2.log
        echo "=== Server3 Log ==="
        cat server3.log
        
        # Test if servers are running
        curl http://localhost:3000/health || echo "Port 3000 failed"
        curl http://localhost:2000/health || echo "Port 2000 failed"
        curl http://localhost:4444/health || echo "Port 4444 failed"
        
        # Start tunnel
        ./cloudflared tunnel --url http://localhost:4444 --no-autoupdate &
        
        sleep 10
        
        echo "Tunnel URL: https://your-tunnel.trycloudflare.com"
        echo "Workflow will run for 6 hours maximum"
        
        # Keep alive
        while true; do sleep 60; done
